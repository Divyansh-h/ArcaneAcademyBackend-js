version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: arcane_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-arcane_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arcane-network

  # Gateway
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: arcane_gateway
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:3001}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:3002}
      - GRADING_SERVICE_URL=${GRADING_SERVICE_URL:-http://grading-service:3004}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    depends_on:
      - auth-service
      - user-service
      - grading-service
    networks:
      - arcane-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: arcane_auth_service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - arcane-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: arcane_user_service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-arcane_db}
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - arcane-network

  # Grading Service
  grading-service:
    build:
      context: .
      dockerfile: services/grading-service/Dockerfile
    container_name: arcane_grading_service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    volumes:
      - arcane_data:/app/uploads
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - arcane-network

  # Redis
  redis:
    image: redis:alpine
    container_name: arcane_redis
    ports:
      - "6379:6379"
    networks:
      - arcane-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: arcane_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - arcane-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  arcane-network:
    driver: bridge

volumes:
  postgres_data:
  arcane_data:
